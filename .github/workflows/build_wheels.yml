name: Build wheels

on: push

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15, macos-15-intel]

    steps:
      - uses: actions/checkout@v6

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_BUILD: "cp3*"
          CIBW_ENVIRONMENT_WINDOWS: "CL=-d2FH4- _CL_=-MT"
          CIBW_BUILD_VERBOSITY: 3

      - uses: actions/upload-artifact@v6
        with:
          name: pybox2d-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
